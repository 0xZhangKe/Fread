#Gradle
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
#org.gradle.configureondemand=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
# Keep the existing kotlin-android and KMP androidTarget setup on AGP 9.
# Migrate to built-in Kotlin and the Android-KMP plugin before upgrading to AGP 10.
android.builtInKotlin=false
android.newDsl=false

# Kotlin
kotlin.code.style=official

# Ksp
ksp.incremental=true
ksp.incremental.log=true

#systemProp.http.proxyHost=
#systemProp.http.proxyPort=80
#systemProp.https.proxyHost=
#systemProp.https.proxyPort=80
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
