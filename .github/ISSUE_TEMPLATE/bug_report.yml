name: "Bug report"
description: "Create a report to help us improve Fread."
title: "[BUG] "
labels: bug

body:
- type: dropdown
  id: plugin
  attributes:
    label: Which plugin did the issue occur in?
    options:
      - Bluesky
      - RSS
      - Mastodon
      - Other
  validations:
    required: true

- type: textarea
  id: description-of-bug
  attributes:
    label: bug description
    description: "Describe the bug"
    placeholder: "A clear and concise description of the bug"
  validations:
    required: true

- type: input
  id: version-of-fread
  attributes:
    label: version of fread
    description: "Which version of fread are you using?"
    placeholder: "v1.9.0"
  validations:
    required: true

- type: textarea
  id: reproduction
  attributes:
    label: steps to reproduce bug
    description: "Steps to reproduce the behaviour"
    placeholder: |
      1. Go to '...'
      2. Press '....'
      3. Scroll down to '....'
      4. see error
  validations:
    required: true

- type: input
  id: expected-behaviour
  attributes:
    label: Expected Behaviour
    description: "What is the expected behaviour"
    placeholder: "A clear and concise description of what you expected to happen."

- type: dropdown
  id: platform
  attributes:
    label: Which platform do you use
    description: "Which operating system do you use?"
    options:
      - Android
      - IOS
  validations:
    required: true

- type: input
  id: platform-version
  attributes:
    label: Platform version
    description: "What's the version of your operating system"
    placeholder: "Android 15"
  validations:
    required: false

- type: upload
  id: screenshots
  attributes:
    label: upload screenshots
    description: "If applicable add screenshots to help explain your problem"
  validations:
    required: false
- type: input
  id: context
  attributes:
    label: Additional context
    description: "Add any other context about the problem"
  validations:
    required: false
